name: 🚀 Deploy Web & CMS (WaveNation)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  id-token: write

env:
  NODE_ENV: production
  TURBO_API: https://api.vercel.com
  CI: true

jobs:
  setup:
    name: 🧩 Setup
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}

    steps:
      - name: 🏁 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9.9.0

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 💾 Cache Turbo build artifacts
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            .turbo
            node_modules
            **/node_modules
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

  test-lint-build:
    name: 🧠 Lint, Typecheck & Build
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: 🏁 Checkout repo
        uses: actions/checkout@v4

      - name: ⚙️ Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9.9.0

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint check
        run: pnpm lint

      - name: 🧠 Type check
        run: pnpm turbo run typecheck

      - name: 🏗️ Build
        run: pnpm turbo run build

  deploy-web:
    name: 🌐 Deploy Web (Vercel)
    runs-on: ubuntu-latest
    needs: test-lint-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🏁 Checkout repo
        uses: actions/checkout@v4

      - name: ⚙️ Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9.9.0

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Deploy to Vercel
        run: |
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel build --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-cms:
    name: 🗃️ Deploy CMS (Render)
    runs-on: ubuntu-latest
    needs: test-lint-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🏁 Checkout repo
        uses: actions/checkout@v4

      - name: 🚀 Trigger Render Deploy
        run: |
          curl -X POST "https://api.render.com/deploy/${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_API_KEY }}"
